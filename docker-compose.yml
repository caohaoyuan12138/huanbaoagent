version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: huanbao-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db:/app/backend/db
      - ./backend/logs:/app/backend/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LLM_BASE_URL=${LLM_BASE_URL:-https://apihub.agnes-ai.cn/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-agnes-2.0-flash}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PLATFORM_ADDRESS=${PLATFORM_ADDRESS:-}
      - PLATFORM_GAS_PORT=${PLATFORM_GAS_PORT:-30541}
      - PLATFORM_WATER_PORT=${PLATFORM_WATER_PORT:-30542}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: huanbao-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
